<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pureikyubu - WebGL Emulator</title>
    <!-- Necesario para SharedArrayBuffer y multihilo (pthread) -->
    <script src="./coi-serviceworker.js"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        async function fetchAndCreateFile(path, url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`No se pudo cargar: ${url}`);
                const buffer = await response.arrayBuffer();
                const data = new Uint8Array(buffer);

                const lastSlash = path.lastIndexOf('/');
                if (lastSlash !== -1) {
                    const dir = path.substring(0, lastSlash);
                    if (dir) FS.mkdirTree(dir);
                }

                FS.writeFile(path, data);
                console.log(`[FS] Archivo cargado: ${path}`);
            } catch (e) {
                console.error(`[FS Error] Falló al cargar ${url}:`, e);
            }
        }

        var canvasElement = document.getElementById('canvas');

        // Respaldo de seguridad estricto para evitar que getContext('2d') retorne null en llamadas secundarias de hilos
        const _getContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(type, attributes) {
            let ctx = _getContext.call(this, type, attributes);
            if (!ctx && type === '2d') {
                console.warn("[Emscripten Fix] Creando respaldo de contexto 2d virtual para SDL");
                // Si el canvas principal está ocupado por WebGL, creamos un canvas oculto temporal para las operaciones 2D de SDL
                let tempCanvas = document.createElement('canvas');
                tempCanvas.width = this.width || 800;
                tempCanvas.height = this.height || 600;
                return _getContext.call(tempCanvas, '2d', attributes);
            }
            return ctx;
        };

        var Module = {
            canvas: canvasElement,
            preRun: [function() {
                FS.mkdirTree('/Data/Json');

                const filesToLoad = [
                    { path: '/games/pong.dol', url: 'games/pong.dol' },
					{ path: '/games/smsplus_cube.dol', url: 'games/smsplus_cube.dol' },
					{ path: '/games/ND Demo - Tech Demo - (USA) (NTSC) FIXED.rvz', url: 'games/ND Demo - Tech Demo - (USA) (NTSC) FIXED.rvz' },
					{ path: '/games/GameCube-240pSuite-1.20.dol', url: 'games/GameCube-240pSuite-1.20.dol' },
					{ path: '/games/scogger.dol', url: 'games/scogger.dol' },
					{ path: '/games/silentskate.dol', url: 'games/silentskate.dol' },
					{ path: '/games/swiss_r2092.dol', url: 'games/swiss_r2092.dol' },
					{ path: '/games/GC-Controller-Test.dol', url: 'games/GC-Controller-Test.dol' },
                    { path: '/Data/DebugUiMono.LICENSE', url: 'Data/DebugUiMono.LICENSE' },
                    { path: '/Data/AnsiFont.szp', url: 'Data/AnsiFont.szp' },
                    { path: '/Data/DebugUiMono.ttf', url: 'Data/DebugUiMono.ttf' },
                    { path: '/Data/DefaultSettingsSdl.json', url: 'Data/DefaultSettingsSdl.json' },
                    { path: '/Data/GBASettings.json', url: 'Data/GBASettings.json' },
					{ path: '/Data/makemap.dat', url: 'Data/makemap.dat' },
                    { path: '/Data/SjisFont.szp', url: 'Data/SjisFont.szp' },
					{ path: '/Data/dsp_drom.bin', url: 'Data/dsp_drom.bin' },
					{ path: '/Data/dsp_irom.bin', url: 'Data/dsp_irom.bin' },
					{ path: '/Data/gc-ntsc-11.bin', url: 'Data/gc-ntsc-11.bin' },
					{ path: '/Data/sram.bin', url: 'Data/sram.bin' }
                ];

                filesToLoad.forEach(file => {
                    Module.addRunDependency('load-file-' + file.path);
                    fetchAndCreateFile(file.path, file.url).finally(() => {
                        Module.removeRunDependency('load-file-' + file.path);
                    });
                });
            }],
            print: (text) => console.log(text),
            printErr: (text) => console.error(text)
        };
    </script>
    <script src="pureikyubu_wasm.js" async></script>
</body>
</html>
